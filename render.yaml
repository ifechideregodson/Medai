services:
  - type: web
    name: medai-clinical-platform
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: medai-postgres
          property: connectionString
      - key: APP_URL
        sync: false
      - key: FIRST_ADMIN_SETUP_SECRET
        generateValue: true
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_SERVER_SIDE_ENCRYPTION
        value: AES256
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: MODEL_GATEWAY_API_KEY
        sync: false
      - key: MODEL_GATEWAY_TIMEOUT_MS
        value: "60000"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_MODEL_VERSION
        value: current
      - key: AI_PROVIDER
        value: registry

databases:
  - name: medai-postgres
    plan: free
    databaseName: medai
    user: medai
